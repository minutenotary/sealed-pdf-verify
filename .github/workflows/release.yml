name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing (OIDC) needs npm >= 11.5.1, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build (cache poisoning).
          package-manager-cache: false
      - run: npm ci
      # The whole gate once; `--ignore-scripts` on publish keeps prepublishOnly
      # from running it a second time (a local `npm publish` still gets it).
      - run: npm run check
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      # Trusted publishing: npm exchanges this job's OIDC token for a one-time
      # publish credential and attaches provenance on its own. No NPM_TOKEN
      # secret exists; the trusted publisher on npmjs.com names this workflow.
      - run: npm publish --access public --ignore-scripts
